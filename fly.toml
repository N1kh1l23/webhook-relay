app = "nikhil-webhook-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# Runs in a temporary machine before the release goes live. Has secrets and
# private network access, no volumes. If it fails, the deploy aborts — which
# is the point: a bad migration never reaches a running machine.
[deploy]
  release_command = "alembic upgrade head"

# Once this block exists, it is the complete list of processes. Each command
# supersedes the Dockerfile CMD.
[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "arq app.worker.WorkerSettings"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

# Liveness only. /health always returns 200 by design, so this proves the
# process is serving, not that dependencies are up. A Postgres blip should
# not get the machine restarted.
[[http_service.http_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"