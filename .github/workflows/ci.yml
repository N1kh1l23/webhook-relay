name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook
          POSTGRES_DB: webhook_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook -d webhook_relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Alembic reads this via app.config.Settings; the sync_database_url
      # property strips +asyncpg for psycopg2.
      DATABASE_URL: postgresql+asyncpg://webhook:webhook@localhost:5432/webhook_relay
      # conftest.py reads this; without it the tests fall back to a default
      # that assumes the test database already exists.
      TEST_DATABASE_URL: postgresql+asyncpg://webhook:webhook@localhost:5432/webhook_relay_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Create test database
        run: |
          PGPASSWORD=webhook psql -h localhost -U webhook -d webhook_relay \
            -c "CREATE DATABASE webhook_relay_test OWNER webhook;"

      - name: Lint
        run: ruff check .

      - name: Verify migrations apply
        run: alembic upgrade head

      - name: Test
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime -t webhook-relay:ci .